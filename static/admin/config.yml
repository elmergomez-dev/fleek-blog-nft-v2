# Use test-repo backend for local testing without GitHub auth setup first
# NOTE: Changes made with test-repo are NOT saved to your Git repo.
backend:
  name: test-repo
  # repo: your-username/your-repo # We'll add this later for production

# Optional: Use local_backend for actual local file editing (requires decap-server)
# local_backend: true

media_folder: "static/images/uploads" # Where media files are stored relative to root
public_folder: "/images/uploads" # Public path to access media files

collections:
  - name: "blog" # Used in routes, e.g., /admin/#/collections/blog
    label: "Blog Posts" # Used in the UI
    folder: "content/blog" # Path to content files relative to root
    create: true # Allow users to create new documents in this collection
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}" # Filename template
    fields: # The fields for each document, usually mapped to YAML front matter.
      - { label: "Layout", name: "layout", widget: "hidden", default: "blog" } # Optional hidden field
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Draft", name: "draft", widget: "boolean", default: true }
      - { label: "Body", name: "body", widget: "markdown" }
      # Add other front matter fields like featuredImage, excerpt etc.
      # Example: - { label: "Featured Image", name: "featuredImage", widget: "image", required: false }
      # Example: - { label: "Excerpt", name: "excerpt", widget: "text", required: false }